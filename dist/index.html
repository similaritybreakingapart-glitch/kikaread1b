<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Kika Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="/assets/index-BsQ9Asou.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Bj0TqVOy.css">
</head>
<body data-theme="warm">

  <!-- App Header -->
  <header class="app-header" id="app-header">
    <div style="display:flex; align-items:center; gap:8px;">
      <button class="icon-btn" id="btn-library" title="Library">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </button>
      <!-- Chapters icon moved to left side next to Library as requested -->
      <button class="icon-btn" id="btn-chapters" title="Chapters" style="display:none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
      </button>
      <div class="header-title" id="header-title">Kika Reader</div>
    </div>
    <div class="header-actions">
      <div id="top-nav-arrows" style="display:none; align-items:center; gap:2px; margin-right:4px;">
        <button class="icon-btn" id="btn-top-prev" title="Previous Page" style="padding:6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-top-next" title="Next Page" style="padding:6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
      <button class="icon-btn" id="btn-theme" title="Toggle Theme">
        <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
    <div class="reading-progress-track">
      <div class="reading-progress-fill" id="progress-bar"></div>
    </div>
  </header>

  <!-- Library View -->
  <main class="view-container" id="library-view">
    <div class="library-hero">
      <h1>Kika Mobile</h1>
      <p>Read German EPUBs with instant dual English & Polish translations</p>
      <input type="file" id="epub-input" accept=".epub" style="display:none;" />
      <button class="btn-primary" id="btn-add-book">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Open EPUB Book
      </button>
    </div>

    <div class="books-grid" id="books-list">
      <!-- Books rendered dynamically -->
    </div>
  </main>

  <!-- Reader View -->
  <main class="view-container" id="reader-view" style="display:none;">
    <div class="reader-content" id="reader-content">
      <!-- Chapter sentences rendered dynamically -->
    </div>

    <!-- Chapter Pagination Footer -->
    <div class="reader-pagination" id="reader-pagination">
      <button class="btn-page-nav" id="btn-prev-chapter">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        Prev
      </button>
      <div class="page-indicator" id="page-indicator">
        <strong>Chapter 1</strong>
        <span>Tap to browse</span>
      </div>
      <button class="btn-page-nav" id="btn-next-chapter">
        Next
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>
  </main>

  <!-- Translation Bottom Drawer -->
  <aside class="translation-drawer" id="translation-drawer">
    <div class="drawer-drag-pill" id="drawer-drag"></div>
    
    <!-- MODE 1: SINGLE WORD TRANSLATION ONLY -->
    <div id="drawer-word-mode">
      <div class="drawer-header">
        <div class="drawer-word-title">
          <span id="tr-word">Wort</span>
          <span class="drawer-pos-badge" id="tr-pos" style="display:none;">VERB</span>
        </div>
        <button class="drawer-tts-btn" id="btn-tts" title="Pronounce">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
      </div>

      <!-- 1. English Translation Box (English 1st as requested) -->
      <div class="lang-translation-box">
        <div class="lang-header">
          <span class="lang-flag">🇬🇧</span> English
        </div>
        <div class="lang-primary" id="tr-en-primary">
          <span class="spinner"></span>
        </div>
        <div class="lang-synonyms" id="tr-en-synonyms"></div>
        <div class="pos-categories" id="tr-en-categories"></div>
      </div>

      <!-- 2. Polish Translation Box (Polish 2nd as requested) -->
      <div class="lang-translation-box">
        <div class="lang-header">
          <span class="lang-flag">🇵🇱</span> Polski
        </div>
        <div class="lang-primary" id="tr-pl-primary">
          <span class="spinner"></span>
        </div>
        <div class="lang-synonyms" id="tr-pl-synonyms"></div>
        <div class="pos-categories" id="tr-pl-categories"></div>
      </div>

      <!-- Button to explicitly open sentence translation if desired -->
      <button class="btn-translate-sentence-trigger" id="btn-trigger-sent-tr">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        Translate Full Sentence
      </button>
    </div>

    <!-- MODE 2: SENTENCE TRANSLATION ONLY (NO BLANK WORDS, ZERO WASTED SPACE) -->
    <div id="drawer-sentence-mode" style="display:none;">
      <div class="drawer-header">
        <div style="font-size:1rem; font-weight:700; color:var(--text-main); display:flex; align-items:center; gap:8px;">
          <span>Sentence Context</span>
        </div>
        <button class="drawer-tts-btn" id="btn-sent-tts" style="width:34px; height:34px;" title="Listen to sentence">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
      </div>

      <div class="sentence-orig-preview" id="sent-orig-text"></div>
      
      <!-- English Sentence (First) -->
      <div class="lang-translation-box" style="margin-bottom:10px;">
        <div class="lang-header"><span class="lang-flag">🇬🇧</span> English</div>
        <div class="lang-primary" id="sent-en-text" style="font-size:1.05rem; font-weight:500;">
          <span class="spinner"></span>
        </div>
      </div>

      <!-- Polish Sentence (Second) -->
      <div class="lang-translation-box" style="margin-bottom:0;">
        <div class="lang-header"><span class="lang-flag">🇵🇱</span> Polski</div>
        <div class="lang-primary" id="sent-pl-text" style="font-size:1.05rem; font-weight:500;">
          <span class="spinner"></span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Chapters Navigation Modal -->
  <div class="chapter-modal" id="chapter-modal">
    <div class="chapter-drawer-content">
      <h3 style="margin-bottom:16px; font-size:1.15rem; color:var(--text-main); display:flex; justify-content:space-between; align-items:center;">
        <span>Chapters</span>
        <button class="icon-btn" id="btn-close-chapters" style="font-size:1rem;">✕</button>
      </h3>
      <div id="chapters-list" style="display:flex; flex-direction:column; gap:4px;"></div>
    </div>
  </div>

  <!-- End-of-Chapter Mini Quiz Modal (Anki style for yellow words) -->
  <div class="quiz-modal" id="quiz-modal">
    <div class="quiz-card">
      <div class="quiz-header">
        <span class="quiz-title" id="quiz-progress-text">Vocabulary Review (1 of 3)</span>
        <button class="quiz-skip-btn" id="btn-skip-quiz">Skip Quiz ✕</button>
      </div>

      <div class="quiz-word-hero">
        <div class="quiz-word-text" id="quiz-word">Wort</div>
        <button class="drawer-tts-btn" id="btn-quiz-tts" style="margin: 0 auto; width:32px; height:32px;" title="Listen">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>
      </div>

      <div class="quiz-context" id="quiz-context">
        "Context sentence will appear here."
      </div>

      <!-- Hidden until user clicks Reveal -->
      <div class="quiz-answer-area" id="quiz-answer-area" style="display:none;">
        <div class="lang-translation-box" style="margin-bottom:6px;">
          <div class="lang-header"><span class="lang-flag">🇬🇧</span> English</div>
          <div class="lang-primary" id="quiz-en-answer" style="font-size:1rem;"></div>
          <div class="lang-synonyms" id="quiz-en-syns"></div>
        </div>
        <div class="lang-translation-box" style="margin-bottom:0;">
          <div class="lang-header"><span class="lang-flag">🇵🇱</span> Polski</div>
          <div class="lang-primary" id="quiz-pl-answer" style="font-size:1rem;"></div>
          <div class="lang-synonyms" id="quiz-pl-syns"></div>
        </div>
      </div>

      <div class="quiz-footer-actions">
        <button class="btn-quiz-reveal" id="btn-quiz-reveal">Show Translation</button>
        <div class="quiz-score-buttons" id="quiz-next-actions" style="display:none;">
          <button class="btn-quiz-next" id="btn-quiz-next">Next Word →</button>
        </div>
        <div class="quiz-pill-switch">
          <span style="font-size:0.75rem; color:var(--text-muted); font-weight:600;">Quiz Timing:</span>
          <div class="pill-group">
            <button type="button" class="pill-btn active" id="btn-quiz-freq-page">Every Page</button>
            <button type="button" class="pill-btn" id="btn-quiz-freq-chapter">End of Chapter</button>
          </div>
        </div>
        <label class="quiz-settings-toggle">
          <input type="checkbox" id="chk-quiz-enabled" checked />
          <span>Enable Vocabulary Mini-Quiz</span>
        </label>
      </div>
    </div>
  </div>

</body>
</html>
